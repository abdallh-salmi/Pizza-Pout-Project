<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Pizza Hout</title>
</head>
<body>
    <div class="top-bar">
        <header>
            <h1>PIZZA <span class="logo">HOUT</span></h1>
        </header>
        <nav class="nav-links">
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#booking">Booking</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#Contact us">Contact us</a></li>
            </ul>
        </nav>
    </div>

    <main>
        <section id="about">
        <div class="container">
            <img src="./Picsart_26-04-11_08-12-22-391.png" alt="Pizza" class="pizza-img">
            <div class="texe-content">
                <h2>Pizza restaurant</h2>
                <h4>
                    Welcome to our pizza restaurant! <br> 
                    Here you will experience the best moments of your life with us. 
                </h4>
            </div>
        </div>
        </section>
        <section id="menu">
        <section class="menu-section">
            <div class="category">
                <h3>BURGER</h3>
                <div class="prix-pizza">
                    <div class="item"><img src="./photo_2026-03-24_23-12-16 (2).jpg" alt=""><p>20$</p></div>
                    <div class="item"><img src="./photo_2026-03-24_23-12-13.jpg" alt=""><p>25$</p></div>
                    <div class="item"><img src="./photo_2026-03-24_23-12-16.jpg" alt=""><p>30$</p></div>
                    <div class="item"><img src="./photo_2026-03-24_23-12-15.jpg" alt=""><p>35$</p></div>
                </div>
            </div>

            <div class="category">
                <h3>AUTHORIT</h3>
                <div class="prix-pizza">
                    <div class="item"><img src="./photo_2026-03-24_23-12-17.jpg" alt=""><p>20$</p></div>
                    <div class="item"><img src="./photo_2026-03-24_23-12-18.jpg" alt=""><p>25$</p></div>
                    <div class="item"><img src="./photo_2026-03-24_23-12-19 (2).jpg" alt=""><p>30$</p></div>
                    <div class="item"><img src="./photo_2026-03-24_23-12-19.jpg" alt=""><p>35$</p></div>
                </div>
            </div>

            <div class="category">
                <h3>PIZZA</h3>
                <div class="prix-pizza">
                    <div class="item"><img src="./1777413670112.png" alt=""><p>20$</p></div>
                    <div class="item"><img src="./1774390104493.png" alt=""><p>25$</p></div>
                    <div class="item"><img src="./1777413283389.png" alt=""><p>30$</p></div>
                    <div class="item"><img src="./1777413943927.png" alt=""><p>35$</p></div>
                </div>
            </div>
        </section>
        </section>
        <section id="booking">
        <section class="order-section">
            <h3>WRITE YOUR REQUEST</h3>
            <div class="container-form">
                <form>
                    <textarea rows="6" placeholder="اكتب طلبك هنا..."></textarea>
                    <button type="submit">إرسال</button>
                </form>
            </div>
        </section>
        </section>
    </main>

    <footer>
        <section id="Contact us">
        <div class="img-contact">
            <img src="./facebook.png" alt="">
            <img src="./instagram.png" alt="">
            <img src="./logo.png" alt="">
            <img src="./gmail.png" alt="">
        </div>
        </section>
    </footer>
</body>
</html>
